<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">June Liu — AI/ML and Backend Engineering</title>
  <desc id="desc">A restrained systems-inspired banner with a deep navy to graphite background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1d2d"/>
      <stop offset="55%" stop-color="#131d28"/>
      <stop offset="100%" stop-color="#1b1d22"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5d86a3" stop-opacity="0"/>
      <stop offset="30%" stop-color="#7ca5c3" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7ca5c3" stop-opacity="0.08"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#b4c7d7" stroke-opacity="0.11" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <path d="M 0 252 H 500" stroke="#7896ad" stroke-opacity="0.22" stroke-width="1"/>
  <path d="M 680 78 H 1198 M 760 160 H 1198 M 690 242 H 1198" stroke="url(#flow)" stroke-width="1.5"/>
  <path d="M 700 78 L 760 160 L 690 242 M 850 78 L 910 160 L 840 242 M 1000 78 L 1060 160 L 990 242" fill="none" stroke="#7ca5c3" stroke-opacity="0.3" stroke-width="1.25"/>
  <g fill="#91b2ca" fill-opacity="0.72">
    <circle cx="760" cy="160" r="4"/>
    <circle cx="910" cy="160" r="4"/>
    <circle cx="1060" cy="160" r="4"/>
  </g>
  <g fill="#b5cad9" fill-opacity="0.22">
    <rect x="1124" y="64" width="48" height="6" rx="3"/>
    <rect x="1098" y="76" width="74" height="6" rx="3"/>
    <rect x="1108" y="88" width="64" height="6" rx="3"/>
  </g>
  <text x="80" y="140" fill="#f1f5f7" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="700" letter-spacing="5">JUNE LIU</text>
  <text x="84" y="181" fill="#9db7c9" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" letter-spacing="2.4">AI/ML + BACKEND ENGINEERING</text>
  <text x="1200" y="278" text-anchor="end" fill="#a7bdcc" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="0.5">Reliable systems. Measurable outcomes.</text>
</svg>
